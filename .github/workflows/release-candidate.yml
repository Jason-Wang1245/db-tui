name: Release candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-matrix:
    name: PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run full compatibility matrix
        env:
          TEST_POSTGRES_VERSION: ${{ matrix.postgresql }}
        run: go test -tags=integration -count=1 ./internal/postgres

  native-smoke:
    name: ${{ matrix.goos }}/${{ matrix.goarch }} native smoke
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build native artifact
        env:
          CGO_ENABLED: '0'
        run: >-
          go build -trimpath
          -ldflags '-s -w -X main.version=rc -X main.commit=${{ github.sha }}'
          -o db-tui ./cmd/db-tui
      - name: Smoke native artifact
        run: ./scripts/smoke.sh ./db-tui ${{ matrix.goos }} ${{ matrix.goarch }}
