name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify generated module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: ./scripts/check-format.sh
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Test with race detector
        run: go test -race ./...
      - name: Scan reachable vulnerabilities
        run: go tool govulncheck ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    name: PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['14', '18']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Testcontainers integration suite
        env:
          TEST_POSTGRES_VERSION: ${{ matrix.postgresql }}
        run: go test -tags=integration -count=1 ./internal/postgres

  snapshot:
    name: Release snapshot
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - name: Verify archives, checksums, and SBOMs
        run: ./scripts/verify-dist.sh
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: dist/
